<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studies & Notes | Seung-Mok Oh</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        header { background-color: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        nav { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; }
        .logo { color: var(--primary-color); font-size: 1.25rem; font-weight: 700; text-decoration: none; letter-spacing: -0.3px; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-color); font-weight: 600; }

        .container { max-width: 1000px; margin: 2.5rem auto; padding: 0 1.5rem; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); margin-bottom: 2rem; }
        .section-title { font-size: 1.25rem; color: var(--primary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }

        .study-item { margin-bottom: 2.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; }
        .study-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }

        .study-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
        .study-title { font-size: 1.1rem; font-weight: 700; color: var(--primary-color); }
        .study-date { font-size: 0.88rem; color: var(--accent-color); font-weight: 600; }
        .study-desc { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 1rem; }

        /* PDF Viewer Styling */
        .pdf-viewer-container {
            width: 100%;
            height: 500px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            margin-bottom: 1rem;
        }

        .pdf-viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-actions {
            display: flex;
            gap: 0.8rem;
        }

        .btn-pdf {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: #eff6ff;
            color: var(--accent-color);
            border: 1px solid #dbeafe;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-pdf:hover {
            background-color: #dbeafe;
        }

        @media (max-width: 768px) { 
            nav { flex-direction: column; gap: 1rem; }
            .study-header { flex-direction: column; }
            .pdf-viewer-container { height: 350px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Seung-Mok Oh</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="studies.html" class="active">Studies</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2 class="section-title">Studies & Reading Notes</h2>

            <div class="study-item">
                <div class="study-header">
                    <span class="study-title">Sample Study Note Title</span>
                    <span class="study-date">2026.08</span>
                </div>
                <p class="study-desc">Brief description or key summary of this study note, literature review, or seminar presentation.</p>

                <div class="pdf-viewer-container">
                    <iframe src="sample.pdf" type="application/pdf"></iframe>
                </div>

                <div class="pdf-actions">
                    <a href="sample.pdf" target="_blank" class="btn-pdf">↗ Open PDF in New Tab</a>
                    <a href="sample.pdf" download class="btn-pdf">⬇ Download PDF</a>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
