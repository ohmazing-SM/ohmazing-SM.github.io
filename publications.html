<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Publications | Seung-Mok Oh</title>
<style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        header { background-color: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        nav { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; }
        .logo { color: var(--primary-color); font-size: 1.25rem; font-weight: 700; text-decoration: none; letter-spacing: -0.3px; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-color); font-weight: 600; }

        .container { max-width: 1000px; margin: 2.5rem auto; padding: 0 1.5rem; }
        .card { background: var(--card-bg); padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); margin-bottom: 2rem; }
        .section-title { font-size: 1.25rem; color: var(--primary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }
        .empty-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.4rem;
        }
        .empty-sub {
            font-size: 0.9rem;
        }

        @media (max-width: 768px) { nav { flex-direction: column; gap: 1rem; } }
    

        /* Keep header/body alignment and scrollbar spacing consistent on every page. */
        html { overflow-y: scroll; }
        body { overflow-wrap: anywhere; }
        nav { padding: 1.2rem 1.5rem; gap: 1.25rem; }
        .logo { flex-shrink: 0; }
        .nav-links { flex-wrap: wrap; justify-content: flex-end; column-gap: 1.15rem; row-gap: 0.5rem; }
        .nav-links a { display: inline-block; white-space: nowrap; }
        .home-grid { grid-template-columns: 300px minmax(0, 1fr); }
        a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent-color); outline-offset: 4px; border-radius: 3px; }
        .project-title { margin: 0; line-height: 1.5; }
        .project-role { font-size: 0.88rem; color: var(--text-muted); margin: 0.35rem 0 0.15rem; }
        .project-status { display: inline-block; color: #1d4ed8; background: #eff6ff; border: 1px solid #dbeafe; font-size: 0.76rem; font-weight: 600; padding: 0.12rem 0.5rem; border-radius: 4px; margin-bottom: 0.75rem; }
        @media (max-width: 940px) {
            nav { flex-direction: column; gap: 0.85rem; }
            .nav-links { justify-content: center; }
        }
        @media (max-width: 768px) {
            .home-grid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 600px) {
            nav { padding: 1rem 1.25rem; }
            .nav-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; gap: 0.6rem 0.35rem; text-align: center; }
            .nav-links a { font-size: 0.82rem; }
            .container { margin-top: 1.5rem; padding: 0 1.25rem; }
            .card, .content-card { padding: 1.35rem; }
            .project-header { flex-direction: column; gap: 0.3rem; }
            .project-date { white-space: normal; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
        }

</style>
</head>

</nav>

</div>
</section>
</main>
</body>
</html>
