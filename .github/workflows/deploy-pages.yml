name: Build academic site and post archive
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academic-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install HTML sanitizer
        run: python -m pip install 'bleach==6.3.0' 'beautifulsoup4==4.14.3'
      - uses: actions/configure-pages@v6
      - name: Build site from existing public board data
        run: python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
